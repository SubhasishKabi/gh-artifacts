name: Deploy website
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint
      - name: Test code
        run: npm run test
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      script_file: ${{ steps.publish.outputs.script_file }}
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: publish JS File name
        id: publish
        run: find dist/assets/js -type f -execdir echo 'script_file={}' >> $GITHUB_OUTPUT ';'
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist
          # path: |
          #   dist
          #   package.json
  # path tells us which file to upload as an artifact. In this case, we are uploading the 'dist' directory and the 'package.json' file as build artifacts.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
      - name: Output file name
        run: echo "${{ needs.build.outputs.script_file }}"
      - name: Deploy
        run: echo "Deploying..."
